# LocalStack = fake AWS on your machine (S3, etc.) for local development.
# Run from repo root:
#   docker compose -f docker-compose.localstack.yml up -d
services:
  localstack:
    image: localstack/localstack:4
    container_name: emporia-localstack
    ports:
      - "4566:4566" # LocalStack edge port (all AWS APIs)
    environment:
      - SERVICES=s3
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localstack-data:
